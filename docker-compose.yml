# RX API on a CUDA host (Vast.ai, Lambda, any GPU box).
#
#   cp .env.example .env      # HF_TOKEN, RX_AUTH_TOKEN, DATA_DIR_HOST
#   docker compose up api
#
# Two bind mounts, both deliberate:
#   /data  the PadChest-GR images + ground truth, read-only — never baked in
#   /var   RX_VAR: adapters, corrections, jobs. Survives the instance; losing
#          it loses every trained adapter version.
# The HF cache is a named volume so a rebuilt container does not re-download
# ~9 GB of weights.

services:
  api:
    build: .
    image: rx-cure-api:latest
    env_file:
      - .env
    environment:
      DEVICE: ${DEVICE:-cuda}
      RX_VAR: /var/rx
      DATA_DIR: /data
      OUTPUT_DIR: /app/RX/outputs/compare
      RX_AUTH_TOKEN: ${RX_AUTH_TOKEN:?set a token in .env}
      TRAIN_MIN_NEW_EXAMPLES: ${TRAIN_MIN_NEW_EXAMPLES:-100}
      TRAIN_REPLAY_RATIO: ${TRAIN_REPLAY_RATIO:-3}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${DATA_DIR_HOST:?set DATA_DIR_HOST in .env}:/data:ro
      - rx-var:/var/rx
      - hf-cache:/root/.cache/huggingface
    ports:
      - "${RX_PORT:-8077}:8077"
    command: ["python3", "serve.py", "--host", "0.0.0.0", "--port", "8077"]
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # /health is open on purpose, and answers before the weights are loaded.
      test: ["CMD", "python3", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8077/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # The benchmark, unchanged: one-shot, produces outputs/compare/.
  benchmark:
    build: .
    image: rx-cure-api:latest
    profiles: ["benchmark"]
    env_file:
      - .env
    environment:
      DEVICE: ${DEVICE:-cuda}
      DATA_DIR: /data
      OUTPUT_DIR: /app/RX/outputs/compare
      N_IMAGES: ${N_IMAGES:-200}
      SHUFFLE_SEED: ${SHUFFLE_SEED:-42}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${DATA_DIR_HOST:?set DATA_DIR_HOST in .env}:/data:ro
      - ./outputs:/app/RX/outputs
      - hf-cache:/root/.cache/huggingface
    entrypoint: ["./entrypoint.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  rx-var:
  hf-cache:
